<title>展示会リード管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root {
  --bg: #EEF2F6;
  --surface: #FFFFFF;
  --surface-alt: #F8FAFB;
  --border: #DAE0E8;
  --border-light: #EDF0F4;
  --text: #111827;
  --text-2: #4B5563;
  --text-3: #9CA3AF;
  --primary: #0D3D30;
  --primary-fg: #FFFFFF;
  --accent: #059669;
  --accent-soft: #ECFDF5;
  --accent-hover: #047857;
  --pa: #DC2626; --pa-bg: #FEF2F2; --pa-border: #FECACA;
  --pb: #D97706; --pb-bg: #FFFBEB; --pb-border: #FDE68A;
  --pc: #6B7280; --pc-bg: #F3F4F6; --pc-border: #E5E7EB;
  --info: #2563EB; --info-bg: #EFF6FF; --info-border: #BFDBFE;
  --purple: #7C3AED; --purple-bg: #F5F3FF; --purple-border: #DDD6FE;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.1);
  --r: 10px;
  --r-lg: 14px;
  --font: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0C1322;--surface:#1A2435;--surface-alt:#1F2B3D;--border:#2D3B4F;--border-light:#253245;
  --text:#E8ECF1;--text-2:#94A3B8;--text-3:#64748B;
  --primary:#34D399;--primary-fg:#0C1322;
  --accent:#34D399;--accent-soft:#064E3B;--accent-hover:#6EE7B7;
  --pa:#EF4444;--pa-bg:#450A0A;--pa-border:#7F1D1D;
  --pb:#F59E0B;--pb-bg:#451A03;--pb-border:#78350F;
  --pc:#9CA3AF;--pc-bg:#1F2937;--pc-border:#374151;
  --info:#60A5FA;--info-bg:#1E3A5F;--info-border:#2563EB;
  --purple:#A78BFA;--purple-bg:#3B2E5C;--purple-border:#7C3AED;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 16px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0C1322;--surface:#1A2435;--surface-alt:#1F2B3D;--border:#2D3B4F;--border-light:#253245;
  --text:#E8ECF1;--text-2:#94A3B8;--text-3:#64748B;
  --primary:#34D399;--primary-fg:#0C1322;
  --accent:#34D399;--accent-soft:#064E3B;--accent-hover:#6EE7B7;
  --pa:#EF4444;--pa-bg:#450A0A;--pa-border:#7F1D1D;
  --pb:#F59E0B;--pb-bg:#451A03;--pb-border:#78350F;
  --pc:#9CA3AF;--pc-bg:#1F2937;--pc-border:#374151;
  --info:#60A5FA;--info-bg:#1E3A5F;--info-border:#2563EB;
  --purple:#A78BFA;--purple-bg:#3B2E5C;--purple-border:#7C3AED;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 16px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#EEF2F6;--surface:#FFFFFF;--surface-alt:#F8FAFB;--border:#DAE0E8;--border-light:#EDF0F4;
  --text:#111827;--text-2:#4B5563;--text-3:#9CA3AF;
  --primary:#0D3D30;--primary-fg:#FFFFFF;
  --accent:#059669;--accent-soft:#ECFDF5;--accent-hover:#047857;
  --pa:#DC2626;--pa-bg:#FEF2F2;--pa-border:#FECACA;
  --pb:#D97706;--pb-bg:#FFFBEB;--pb-border:#FDE68A;
  --pc:#6B7280;--pc-bg:#F3F4F6;--pc-border:#E5E7EB;
  --info:#2563EB;--info-bg:#EFF6FF;--info-border:#BFDBFE;
  --purple:#7C3AED;--purple-bg:#F5F3FF;--purple-border:#DDD6FE;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 4px 16px rgba(0,0,0,.1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;width:100%;transition:border-color .2s;font-size:16px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}

/* ===== HEADER ===== */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.app-title{font-size:17px;font-weight:700;letter-spacing:-.02em}
.app-title span{color:var(--accent);margin-right:8px}
.theme-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s;-webkit-tap-highlight-color:transparent}
.theme-btn:hover{background:var(--surface-alt)}
.theme-btn svg{width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== TOP TAB NAV (desktop) ===== */
.tab-nav-top{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-nav-top::-webkit-scrollbar{display:none}
.tab-btn-top{padding:14px 20px;font-size:14px;font-weight:500;color:var(--text-3);white-space:nowrap;position:relative;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tab-btn-top::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:2.5px;border-radius:2px 2px 0 0;background:transparent;transition:background .2s}
.tab-btn-top.active{color:var(--accent)}
.tab-btn-top.active::after{background:var(--accent)}
.tab-btn-top:hover{color:var(--text)}

/* ===== BOTTOM NAV (mobile) ===== */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:100;padding-bottom:var(--safe-b)}
.bottom-nav-inner{display:flex;height:56px}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-size:10px;font-weight:600;-webkit-tap-highlight-color:transparent;transition:color .2s;position:relative}
.bnav-btn.active{color:var(--accent)}
.bnav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav-center{position:relative;flex:1.2}
.bnav-center-btn{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(5,150,105,.4);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.bnav-center-btn:active{transform:translateX(-50%) scale(.92)}
.bnav-center-btn svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bnav-center-label{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--accent);white-space:nowrap}

/* ===== FAB (desktop only) ===== */
.fab{position:fixed;bottom:28px;right:28px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(5,150,105,.35);z-index:90;transition:transform .15s}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(.95)}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ===== MAIN ===== */
main{padding:24px;max-width:1600px;margin:0 auto}
.section{display:none}
.section.active{display:block}

/* ===== KPI ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--surface);border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.kpi-card-clickable{cursor:pointer;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.kpi-card-clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-md,0 4px 12px rgba(0,0,0,.08))}
.stage-list-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);cursor:pointer;border:1px solid var(--border-light);margin-bottom:8px}
.stage-list-row:hover{background:var(--bg-2,rgba(0,0,0,.03))}
.stage-list-photo{width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg-2,#f0f0f0);display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.stage-list-photo img{width:100%;height:100%;object-fit:cover}
.stage-list-info{flex:1;min-width:0}
.stage-list-name{font-weight:600;font-size:14px}
.stage-list-company{font-size:12px;color:var(--text-3)}
.kpi-label{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi-value{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-target{font-size:18px;font-weight:600;color:var(--text-3)}
.kpi-sub{font-size:12px;color:var(--text-3);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi-progress{width:100%;height:6px;background:var(--surface-alt);border-radius:3px;margin-top:10px;overflow:hidden}
.kpi-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .6s ease}
.kpi-card.--a .kpi-value{color:var(--pa)}
.kpi-card.--b .kpi-value{color:var(--pb)}
.kpi-card.--c .kpi-value{color:var(--pc)}

/* ===== DASHBOARD ===== */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.dash-card{background:var(--surface);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.dash-card h3{font-size:14px;font-weight:700;margin-bottom:16px;letter-spacing:-.01em}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px}
.bar-label{width:100px;flex-shrink:0;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:22px;background:var(--surface-alt);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .6s ease;min-width:2px}
.bar-pct{width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text-3);font-size:12px;font-weight:600}

.priority-list{list-style:none}
.priority-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-light);-webkit-tap-highlight-color:transparent}
.priority-item:last-child{border-bottom:none}
.priority-badge{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.priority-badge.--a{background:var(--pa-bg);color:var(--pa);border:1px solid var(--pa-border)}
.priority-badge.--b{background:var(--pb-bg);color:var(--pb);border:1px solid var(--pb-border)}
.priority-badge.--c{background:var(--pc-bg);color:var(--pc);border:1px solid var(--pc-border)}
.priority-info{flex:1;min-width:0}
.priority-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.priority-company{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.priority-team{font-size:11px;color:var(--accent);font-weight:600}

/* ===== UPLOAD (mobile-optimized) ===== */
.upload-area{margin-bottom:20px}
.upload-btns{display:flex;gap:12px}
.upload-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 16px;border:2px dashed var(--border);border-radius:var(--r-lg);cursor:pointer;transition:border-color .2s,background .2s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.upload-btn:active{background:var(--accent-soft);border-color:var(--accent)}
.upload-btn svg{stroke:var(--accent)}
.upload-btn span{font-size:13px;font-weight:600;color:var(--text-2)}
.upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-preview{position:relative;margin-bottom:20px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface-alt)}
.upload-preview img{width:100%;max-height:240px;object-fit:contain;display:block}
.upload-preview .remove-photo{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:20px;-webkit-tap-highlight-color:transparent}
.ocr-status{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--info-bg);border:1px solid var(--info-border);border-radius:var(--r);color:var(--info);font-size:13px;font-weight:600;margin-bottom:20px}
.ocr-spinner{width:16px;height:16px;border:2px solid var(--info-border);border-top-color:var(--info);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-error{background:var(--pa-bg);border-color:var(--pa-border);color:var(--pa)}
.ocr-result-hint{font-size:12px;color:var(--text-3);margin:-8px 0 4px}

/* ===== FORM ===== */
.form-card{background:var(--surface);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);max-width:720px;margin:0 auto}
.form-card h2{font-size:18px;font-weight:700;margin-bottom:20px;letter-spacing:-.02em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:13px;font-weight:600;color:var(--text-2)}
.form-label .required{color:var(--pa);margin-left:2px}

.team-select{display:flex;gap:8px;flex-wrap:wrap}
.team-option{padding:10px 18px;border-radius:24px;font-size:14px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);transition:all .15s;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:44px;display:flex;align-items:center}
.team-option:active{transform:scale(.96)}
.team-option.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.team-option input{display:none}

.priority-select{display:flex;gap:10px}
.prio-option{flex:1;padding:14px;border-radius:var(--r);font-size:17px;font-weight:800;text-align:center;border:2px solid var(--border);background:var(--surface);transition:all .15s;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:52px;display:flex;align-items:center;justify-content:center}
.prio-option:active{transform:scale(.96)}
.prio-option.--a.selected{background:var(--pa-bg);border-color:var(--pa);color:var(--pa)}
.prio-option.--b.selected{background:var(--pb-bg);border-color:var(--pb);color:var(--pb)}
.prio-option.--c.selected{background:var(--pc-bg);border-color:var(--pc);color:var(--pc)}
.prio-option input{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:var(--r);font-size:15px;font-weight:600;transition:all .15s;-webkit-tap-highlight-color:transparent;min-height:48px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-outline{border:1.5px solid var(--border);background:var(--surface)}
.btn-danger{background:var(--pa);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;min-height:38px}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}

/* ===== STICKY SUBMIT (mobile) ===== */
.sticky-submit{display:none}

/* ===== FILTER BAR ===== */
.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar input[type="text"]{max-width:280px}
.filter-bar select{max-width:160px;padding:10px 12px;font-size:14px}
.export-btn{margin-left:auto}

/* ===== LEAD GRID ===== */
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lead-card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.lead-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.lead-card:active{transform:scale(.98)}
.lead-card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.lead-card-photo{width:56px;height:56px;border-radius:var(--r);background:var(--surface-alt);overflow:hidden;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--border-light)}
.lead-card-photo img{width:100%;height:100%;object-fit:cover}
.lead-card-photo svg{stroke:var(--text-3)}
.lead-card-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.lead-card-company{font-size:13px;color:var(--text-2);margin-top:2px}
.lead-card-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge-industry{background:var(--accent-soft);color:var(--accent)}
.badge-team{background:var(--surface-alt);color:var(--text-2);border:1px solid var(--border-light)}
.badge-stage-todo{background:var(--pc-bg);color:var(--pc);border:1px solid var(--pc-border)}
.badge-stage-contacted{background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)}
.badge-stage-scheduled{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.badge-stage-done{background:var(--accent-soft);color:var(--accent);border:1px solid var(--border-light)}
.badge-overdue{background:var(--pa-bg);color:var(--pa);border:1px solid var(--pa-border);font-weight:800}
.followup-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.followup-column{flex:0 0 280px;scroll-snap-align:start;background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);display:flex;flex-direction:column;max-height:70vh;overflow-y:auto}
@media(max-width:600px){.followup-column{flex:0 0 85vw}}
.followup-column-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--border-light)}
.followup-column-title{font-size:15px;font-weight:700}
.followup-column-count{font-size:11px;font-weight:700;color:var(--text-3);background:var(--surface-alt);padding:3px 9px;border-radius:10px}
.followup-row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--border-light);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;border-radius:6px}
.followup-row:last-child{border-bottom:none}
.followup-row:hover,.followup-row:active{background:var(--surface-alt)}
.followup-row-photo{width:26px;height:26px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--surface-alt);display:grid;place-items:center;border:1px solid var(--border-light)}
.followup-row-photo img{width:100%;height:100%;object-fit:cover}
.followup-row-photo svg{width:14px;height:14px}
.followup-row-name{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.followup-row .priority-badge{width:20px;height:20px;font-size:10px;flex-shrink:0;border-radius:5px}
.followup-row .badge{flex-shrink:0;white-space:nowrap;font-size:10px;padding:2px 7px}
.followup-column-empty{text-align:center;padding:20px 8px;color:var(--text-3);font-size:12px}
.lead-card-notes{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead-card-date{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.lead-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.visible{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;width:calc(100% - 48px);max-width:760px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:32px;transform:translate(-50%,calc(-50% + 16px));transition:transform .25s}
.modal-overlay.visible .modal{transform:translate(-50%,-50%)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}

<script>
const TEAM = ['菅野','木下','プロイ','松尾','宇井','板橋'];
const INDUSTRIES = ['製造/素材','情報通信/IT','サービス/人材','金融/保険','不動産/建設','小売/流通','医療/福祉','教育/研究','広告/メディア','コンサル','その他'];
const IND_KEYS = {
  '製造/素材':['製造','工業','機械','電機','素材','化学','金属','メーカー','鉄鋼','繊維','プラスチック','部品','精密'],
  '情報通信/IT':['システム','ソフト','テック','IT','デジタル','クラウド','データ','AI','ネット','ウェブ','アプリ','セキュリティ','SaaS','DX','ソリューション','インフォ','コンピュータ'],
  'サービス/人材':['サービス','人材','スタッフ','派遣','アウトソーシング','BPO','代行','清掃','警備'],
  '金融/保険':['銀行','証券','保険','ファイナンス','リース','信託','投資','キャピタル','アセット'],
  '不動産/建設':['不動産','建設','建築','住宅','土木','ハウス','開発','設計','工務'],
  '小売/流通':['小売','流通','商事','貿易','卸','ストア','マート','EC','コマース','物流'],
  '医療/福祉':['医療','病院','薬','ヘルスケア','福祉','介護','メディカル','バイオ','製薬','クリニック'],
  '教育/研究':['教育','大学','学校','研究','アカデミー','学院','塾','スクール'],
  '広告/メディア':['広告','メディア','マーケティング','PR','デザイン','クリエイティブ','出版','印刷','映像','放送','制作'],
  'コンサル':['コンサル','アドバイザ','戦略','経営','総研','シンクタンク'],
};

function classifyIndustry(c){
  if(!c)return 'その他';
  for(const[ind,keys]of Object.entries(IND_KEYS)){if(keys.some(k=>c.includes(k)))return ind}
  return 'その他';
}

function captureRegFormState(){
  return{
    notes:document.getElementById('regNotes')?.value??'',
    unansweredQ:document.getElementById('regUnansweredQ')?.value??'',
    team:document.querySelector('#sec-register input[name="regTeam"]:checked')?.value??'',
    priority:document.querySelector('#sec-register input[name="regPriority"]:checked')?.value??''
  };
}
function restoreRegFormState(s){
  if(!s)return;
  const notesEl=document.getElementById('regNotes');if(notesEl)notesEl.value=s.notes;
  const uqEl=document.getElementById('regUnansweredQ');if(uqEl)uqEl.value=s.unansweredQ;
  if(s.team){
    const teamInput=document.querySelector(`#sec-register input[name="regTeam"][value="${s.team}"]`);
    if(teamInput){teamInput.checked=true;teamInput.closest('.team-option').classList.add('selected')}
  }
  if(s.priority){
    const prioInput=document.querySelector(`#sec-register input[name="regPriority"][value="${s.priority}"]`);
    if(prioInput){prioInput.checked=true;prioInput.closest('.prio-option').classList.add('selected')}
  }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function callOcr(base64,mimeType){
  const resp=await fetch('/api/ocr',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:base64,mimeType})
  });
  const data=await resp.json();
  return {ok:resp.ok,status:resp.status,data};
}

// 読み取りが混み合っている（無料枠のレート制限）場合は少し待って自動で再試行する
async function runOcr(photoDataUrl){
  let saved=captureRegFormState();
  state.regOcrStatus='running';
  renderRegister();
  restoreRegFormState(saved);
  const mimeType=photoDataUrl.match(/^data:([^;]+);/)?.[1]||'image/jpeg';
  const base64=photoDataUrl.split(',')[1];
  const MAX_RETRIES=2;
  try{
    let result=await callOcr(base64,mimeType);
    let attempt=0;
    while(result.status===429&&attempt<MAX_RETRIES){
      attempt++;
      state.regOcrStatus='retrying';
      saved=captureRegFormState();
      renderRegister();
      restoreRegFormState(saved);
      const wait=Math.min(Math.max(result.data.retryAfter||20,5),30);
      await sleep(wait*1000);
      state.regOcrStatus='running';
      saved=captureRegFormState();
      renderRegister();
      restoreRegFormState(saved);
      result=await callOcr(base64,mimeType);
    }
    const {ok,data}=result;
    if(!ok||data.error)throw new Error(data.error||'OCR failed');
    const company=data.company||'';
    state.regExtracted={
      company,
      name:data.name||'',
      department:data.department||'',
      position:data.position||'',
      phone:data.phone||'',
      email:data.email||'',
      address:data.address||'',
      industry:company?classifyIndustry(company):''
    };
    state.regOcrStatus='done';
  }catch(e){
    state.regOcrStatus='error';
  }
  saved=captureRegFormState();
  renderRegister();
  restoreRegFormState(saved);
}

// 編集モーダルで、保存済みの名刺写真を使ってOCRを再実行する。
// すでに手入力されている項目は上書きせず、空欄だけを埋める。
async function rescanPhoto(id){
  const lead=state.leads.find(x=>x.id===id);
  const btn=document.getElementById('rescanBtn');
  const statusEl=document.getElementById('rescanStatus');
  if(!lead||!lead.photo){toast('写真がありません');return}
  if(btn)btn.disabled=true;
  if(statusEl){statusEl.style.display='flex';statusEl.classList.remove('ocr-error');statusEl.innerHTML='<div class="ocr-spinner"></div>読み取り中...'}
  const mimeType=lead.photo.match(/^data:([^;]+);/)?.[1]||'image/jpeg';
  const base64=lead.photo.split(',')[1];
  const MAX_RETRIES=2;
  try{
    let result=await callOcr(base64,mimeType);
    let attempt=0;
    while(result.status===429&&attempt<MAX_RETRIES){
      attempt++;
      const wait=Math.min(Math.max(result.data.retryAfter||20,5),30);
      if(statusEl)statusEl.innerHTML=`<div class="ocr-spinner"></div>混み合っています。${wait}秒待って再試行します...`;
      await sleep(wait*1000);
      if(statusEl)statusEl.innerHTML='<div class="ocr-spinner"></div>読み取り中...';
      result=await callOcr(base64,mimeType);
    }
    const {ok,data}=result;
    if(!ok||data.error)throw new Error(data.error||'OCR failed');
    const fieldMap={editName:data.name,editCompany:data.company,editDept:data.department,editPosition:data.position,editPhone:data.phone,editEmail:data.email,editAddress:data.address};
    let filled=0;
    Object.entries(fieldMap).forEach(([elId,val])=>{
      const inp=document.getElementById(elId);
      if(inp&&!inp.value.trim()&&val){inp.value=val;filled++}
    });
    if(statusEl){statusEl.style.display='none'}
    toast(filled?`${filled}件の空欄に反映しました`:'読み取りましたが、新しい情報はありませんでした');
  }catch(e){
    if(statusEl){statusEl.classList.add('ocr-error');statusEl.innerHTML='読み取りに失敗しました'}
  }
  if(btn)btn.disabled=false;
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
// サーバーから取得するリードの並び順は保存方式の都合上、取得のたびに
// 前後することがある。並び順が変わるたびに一覧が作り直され、閲覧・
// スクロール中に表示が「流れる」ように見える不具合の原因になっていた
// ため、常にID（登録順）で決定的にソートしてから表示する。
function sortLeadsStable(arr){return[...arr].sort((a,b)=>a.id<b.id?1:a.id>b.id?-1:0)}
function today(){return new Date().toISOString().slice(0,10)}
function isMobile(){return window.innerWidth<=600}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function daysSince(dateStr){return Math.floor((new Date(today())-new Date(dateStr))/86400000)}
function photoOrIcon(l){return l.photo?`<img src="${l.photo}" alt="">`:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'}

const state={tab:'dashboard',leads:[],filters:{q:'',team:'',priority:'',industry:''},regPhoto:null,regOcrStatus:'idle',regExtracted:{company:'',name:'',department:'',position:'',phone:'',email:'',address:'',industry:''}};

function migrateFields(l){
  return {
    id:uid(),address:'',nextAction:'',followed:false,photo:null,unansweredQ:'',
    followupStatus:'未着手',contactMethod:'',contactedDate:'',meetingType:'',meetingDate:'',
    ...l
  };
}

function loadLocal(){
  const d=localStorage.getItem('exh-leads');
  return d?JSON.parse(d).map(migrateFields):[];
}

// leads配列全体をまとめて送信すると、件数が増えるほどリクエストが肥大化し
// 一定件数（写真データ込みで数十件）を超えた時点でサーバー側の上限に達して
// 同期が失敗してしまう。そのため1件ずつサーバーへ送る方式にしている。
// 写真はサイズが大きいためサーバーには送らず、各端末のローカルにのみ保持する
// （共有したいのは氏名・会社名・連絡先などのテキスト情報のため）。
function stripPhoto(lead){
  const {photo,...rest}=lead;
  return rest;
}

function save(){
  try{
    localStorage.setItem('exh-leads',JSON.stringify(state.leads));
  }catch(e){
    console.warn('localStorage save failed',e);
  }
}

function syncLeadToServer(lead){
  fetch('/api/leads',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lead:stripPhoto(lead)})
  }).catch(()=>{});
}

function deleteLeadFromServer(id){
  fetch('/api/leads?id='+encodeURIComponent(id),{method:'DELETE'}).catch(()=>{});
}

// サーバーの最新データを取得し、このデバイスにしかないローカルデータ（未共有分）があれば
// 1件ずつサーバーへ書き戻す。写真は各端末のローカルデータを優先して保持する。
// オフライン時はローカルデータのみで動作する。
async function syncFromServer(){
  const local=loadLocal();
  try{
    const res=await fetch('/api/leads');
    if(!res.ok)throw new Error('fetch failed');
    const data=await res.json();
    const deletedIds=new Set(data.deletedIds||[]);
    const localById=new Map(local.map(l=>[l.id,l]));
    const serverLeads=(data.leads||[]).map(migrateFields).map(sl=>{
      const ll=localById.get(sl.id);
      return (ll&&ll.photo&&!sl.photo)?{...sl,photo:ll.photo}:sl;
    });
    const serverIds=new Set(serverLeads.map(l=>l.id));
    // 他端末で削除済みのリードは、このデバイスにローカルキャッシュが
    // 残っていても復活させない
    const localOnly=local.filter(l=>!serverIds.has(l.id)&&!deletedIds.has(l.id));
    const merged=[...serverLeads,...localOnly];
    state.leads=merged;
    save();
    for(const l of localOnly){
      await fetch('/api/leads',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({lead:stripPhoto(l)})
      }).catch(()=>{});
    }
    return true;
  }catch(e){
    state.leads=local;
    return false;
  }
}

function load(){
  state.leads=loadLocal();
}


function resizeImg(file){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const MAX=480;
      let w=img.width,h=img.height;
      if(w>MAX){h=h*MAX/w;w=MAX}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',.55));
      URL.revokeObjectURL(img.src);
    };
    img.src=URL.createObjectURL(file);
  });
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

function updateStickySubmit(){

function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.tab-btn-top').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+tab));
  render();
  updateStickySubmit();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  if(state.tab==='dashboard')renderDash();
  else if(state.tab==='register')renderRegister();
  else if(state.tab==='leads')renderLeads();
  else if(state.tab==='followup')renderFollowup();
}

function renderDash(){
  const el=document.getElementById('sec-dashboard');
  const leads=state.leads;
  const a=leads.filter(l=>l.priority==='A').length;
  const b=leads.filter(l=>l.priority==='B').length;
  const c=leads.filter(l=>l.priority==='C').length;
  const indCounts={};
  leads.forEach(l=>{indCounts[l.industry]=(indCounts[l.industry]||0)+1});
  const indSorted=Object.entries(indCounts).sort((x,y)=>y[1]-x[1]);
  const indMax=indSorted.length?indSorted[0][1]:1;
  const teamCounts={};
  leads.forEach(l=>{teamCounts[l.team]=(teamCounts[l.team]||0)+1});
  const teamSorted=Object.entries(teamCounts).sort((x,y)=>y[1]-x[1]);
  const teamMax=teamSorted.length?teamSorted[0][1]:1;
  const prioLeads=sortLeadsStable(leads.filter(l=>l.priority==='A'&&!l.followed)).slice(0,6);

  el.innerHTML=`
    <div class="kpi-row">

// 作り直していたこと（IMEの変換セッションが強制的に中断される）。
// 検索バー（input/select）は最初の1回だけ作り、以降は結果一覧
// (#leadsResults)だけを差し替えるようにして、入力欄には一切触れない

function renderLeadsList(){
  const container=document.getElementById('leadsResults');
  if(!container)return;
  const f=state.filters;
  const filtered=sortLeadsStable(state.leads.filter(l=>{
    if(f.q&&!`${l.name}${l.company}${l.notes}${l.unansweredQ||''}`.toLowerCase().includes(f.q.toLowerCase()))return false;
    if(f.team&&l.team!==f.team)return false;
    if(f.priority&&l.priority!==f.priority)return false;
    if(f.industry&&l.industry!==f.industry)return false;
    return true;
  }));
  // 中身が前回と変わっていなければ作り直さない。背景の自動更新の
  // たびに画像を含むカードを全部再生成すると、ちらつきやスクロール
  // 位置のずれ（「流れる」ように見える現象）につながるため。
  const signature=filtered.map(l=>[l.id,l.name,l.company,l.position,l.priority,l.industry,l.team,l.notes,l.unansweredQ,l.date,String(!!l.photo),l.followupStatus,l.contactMethod,l.meetingType,l.meetingDate].join(String.fromCharCode(1))).join(String.fromCharCode(2));
  if(container.dataset.signature===signature)return;
  container.dataset.signature=signature;
  const scrollY=window.scrollY;
  container.innerHTML=filtered.length?`
      <div class="lead-grid">${filtered.map(l=>`
        <div class="lead-card" data-action="view" data-id="${l.id}">
          <div class="lead-card-top">

          </div>
          <div class="lead-card-badges"><span class="badge badge-industry">${esc(l.industry)}</span><span class="badge badge-team">${esc(l.team)}</span></div>
          ${l.notes?`<div class="lead-card-notes">${esc(l.notes)}</div>`:''}

          <div class="lead-card-footer"><div class="lead-card-date">${l.date}</div>${stageBadgeHtml(l)}</div>
        </div>`).join('')}</div>
    `:`<div class="empty-state">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <p>リードが見つかりません</p><small>フィルタを変更するか、新しい名刺を登録してください</small>
      </div>`;
  window.scrollTo(0,scrollY);
}

function stageLabel(status){
  return status==='未着手'?'未対応':status==='連絡済み'?'日程調整中':status;
}
function stageBadgeHtml(l){
  const days=daysSince(l.date);
  if(l.followupStatus==='連絡済み')return `<span class="badge badge-stage-contacted">${stageLabel(l.followupStatus)}${l.contactMethod?'・'+esc(l.contactMethod):''}</span>`;
  if(l.followupStatus==='日程確定')return `<span class="badge badge-stage-scheduled">${esc(l.meetingType||'')} ${esc(l.meetingDate||'')}</span>`;
  if(l.followupStatus==='完了')return `<span class="badge badge-stage-done">完了${l.meetingType?'・'+esc(l.meetingType):''}</span>`;
  return days>5?`<span class="badge badge-overdue">要対応（${days}日経過）</span>`:`<span class="badge badge-stage-todo">${stageLabel(l.followupStatus)}（${days}日経過）</span>`;
}
function stageBadgeCompact(l){
  if(l.followupStatus==='連絡済み')return `<span class="badge badge-stage-contacted">${stageLabel(l.followupStatus)}</span>`;
  if(l.followupStatus==='日程確定')return `<span class="badge badge-stage-scheduled">${esc(l.meetingType||'確定')}</span>`;
  if(l.followupStatus==='完了')return `<span class="badge badge-stage-done">完了</span>`;
  return daysSince(l.date)>5?`<span class="badge badge-overdue">要対応</span>`:`<span class="badge badge-stage-todo">${stageLabel(l.followupStatus)}</span>`;
}
function followupActionHtml(l){
  if(l.followupStatus==='未着手')return `<button class="btn btn-primary btn-sm" data-action="openContactModal" data-id="${l.id}">連絡した</button>`;
  if(l.followupStatus==='連絡済み')return `<button class="btn btn-primary btn-sm" data-action="openMeetingModal" data-id="${l.id}">日程を確定</button>`;
  if(l.followupStatus==='日程確定')return `<button class="btn btn-primary btn-sm" data-action="markDone" data-id="${l.id}">完了にする</button>`;
  return '';
}

function sortByFollowupPriority(arr){
  const order={'未着手':0,'連絡済み':1,'日程確定':2,'完了':3};
  // 同順位（同じ日付など）になった場合はIDで決定的にタイブレークする。
  // これがないと、同一条件のリードの並びが取得のたびに入れ替わり、
  // 一覧が「流れる」ように見えてしまう。
  return[...arr].sort((a,b)=>{
    const oa=order[a.followupStatus]??0,ob=order[b.followupStatus]??0;
    if(oa!==ob)return oa-ob;
    let diff=0;
    if(a.followupStatus==='未着手')diff=daysSince(b.date)-daysSince(a.date);
    else if(a.followupStatus==='連絡済み')diff=new Date(a.contactedDate||a.date)-new Date(b.contactedDate||b.date);
    else if(a.followupStatus==='日程確定')diff=new Date(a.meetingDate||'9999-12-31')-new Date(b.meetingDate||'9999-12-31');
    else diff=new Date(b.meetingDate||b.date)-new Date(a.meetingDate||a.date);
    return diff!==0?diff:(a.id<b.id?1:a.id>b.id?-1:0);
  });
}

        ${lead.notes?`<div class="detail-label">備考</div><div class="detail-value">${esc(lead.notes)}</div>`:''}
        ${lead.unansweredQ?`<div class="detail-label">未回答の質問</div><div class="detail-value" style="color:var(--pb)">${esc(lead.unansweredQ)}</div>`:''}
        ${lead.nextAction?`<div class="detail-label">次のアクション</div><div class="detail-value">${esc(lead.nextAction)}</div>`:''}
        <div class="detail-label">登録日</div><div class="detail-value">${lead.date}</div>
        <div class="detail-label">進捗</div><div class="detail-value">${stageBadgeHtml(lead)}</div>
      </div>
      <div class="modal-actions">
        ${followupActionHtml(lead)}
        <button class="btn btn-outline btn-sm" data-action="editLead" data-id="${lead.id}">編集</button>
        <button class="btn btn-danger btn-sm" data-action="deleteLead" data-id="${lead.id}">削除</button>
      </div>`;
  } else if(mode==='followup-contact'){
    modal.innerHTML=`
      <div class="modal-header"><h2>連絡方法を記録</h2><button class="modal-close" data-action="closeModal">&times;</button></div>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">連絡方法</label>
          <div class="team-select">
            <label class="team-option"><input type="radio" name="contactMethod" value="メール">メール</label>
            <label class="team-option"><input type="radio" name="contactMethod" value="電話">電話</label>
          </div>
        </div>
      </div>
      <div class="form-actions" style="margin-top:20px;display:flex">
        <button class="btn btn-outline" data-action="closeModal">キャンセル</button>
        <button class="btn btn-primary" data-action="saveContact" data-id="${lead.id}">記録する</button>
      </div>`;
    modal.querySelectorAll('.team-option').forEach(elx=>{
      elx.addEventListener('click',()=>{modal.querySelectorAll('.team-option').forEach(o=>o.classList.remove('selected'));elx.classList.add('selected');elx.querySelector('input').checked=true});
    });
  } else if(mode==='followup-meeting'){
    modal.innerHTML=`
      <div class="modal-header"><h2>日程を確定</h2><button class="modal-close" data-action="closeModal">&times;</button></div>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">面談形式</label>
          <div class="team-select">
            <label class="team-option"><input type="radio" name="meetingType" value="ZOOM">ZOOM</label>
            <label class="team-option"><input type="radio" name="meetingType" value="対面">対面</label>
          </div>
        </div>
        <div class="form-group full"><label class="form-label">面談日</label><input type="date" id="meetingDateInput" value="${esc(lead.meetingDate||'')}"></div>
      </div>
      <div class="form-actions" style="margin-top:20px;display:flex">
        <button class="btn btn-outline" data-action="closeModal">キャンセル</button>
        <button class="btn btn-primary" data-action="saveMeeting" data-id="${lead.id}">確定する</button>
      </div>`;
    modal.querySelectorAll('.team-option').forEach(elx=>{
      elx.addEventListener('click',()=>{modal.querySelectorAll('.team-option').forEach(o=>o.classList.remove('selected'));elx.classList.add('selected');elx.querySelector('input').checked=true});
    });
  } else {
    modal.innerHTML=`
      <div class="modal-header"><h2>リード編集</h2><button class="modal-close" data-action="closeModal">&times;</button></div>
      ${lead.photo?`
        <div style="margin-bottom:16px">
          <img class="modal-photo" src="${lead.photo}" alt="名刺" style="max-height:160px">
          <button class="btn btn-outline btn-sm" data-action="rescanPhoto" data-id="${lead.id}" id="rescanBtn" style="margin-top:8px;width:100%">名刺写真から再読み込み</button>
          <div id="rescanStatus" class="ocr-status" style="display:none;margin-top:8px"></div>
        </div>
      `:''}
      <div class="form-grid">
        <div class="form-group"><label class="form-label">氏名</label><input id="editName" value="${esc(lead.name)}"></div>
        <div class="form-group"><label class="form-label">会社名</label><input id="editCompany" value="${esc(lead.company)}"></div>
        <div class="form-group"><label class="form-label">部署</label><input id="editDept" value="${esc(lead.department||'')}"></div>
        <div class="form-group"><label class="form-label">役職</label><input id="editPosition" value="${esc(lead.position||'')}"></div>
        <div class="form-group"><label class="form-label">メール</label><input id="editEmail" value="${esc(lead.email||'')}"></div>
        <div class="form-group"><label class="form-label">電話</label><input id="editPhone" value="${esc(lead.phone||'')}"></div>
        <div class="form-group full"><label class="form-label">住所</label><input id="editAddress" value="${esc(lead.address||'')}"></div>
        <div class="form-group full"><label class="form-label">業種</label><select id="editIndustry">${INDUSTRIES.map(i=>`<option${lead.industry===i?' selected':''}>${i}</option>`).join('')}</select></div>
        <div class="form-group full"><label class="form-label">担当者</label>
          <div class="team-select">${TEAM.map(t=>`<label class="team-option${lead.team===t?' selected':''}"><input type="radio" name="editTeam" value="${t}"${lead.team===t?' checked':''}>${t}</label>`).join('')}</div>
        </div>
        <div class="form-group full"><label class="form-label">重要度</label>
          <div class="priority-select">
            <label class="prio-option --a${lead.priority==='A'?' selected':''}"><input type="radio" name="editPriority" value="A"${lead.priority==='A'?' checked':''}>A</label>
            <label class="prio-option --b${lead.priority==='B'?' selected':''}"><input type="radio" name="editPriority" value="B"${lead.priority==='B'?' checked':''}>B</label>
            <label class="prio-option --c${lead.priority==='C'?' selected':''}"><input type="radio" name="editPriority" value="C"${lead.priority==='C'?' checked':''}>C</label>
          </div>
        </div>
        <div class="form-group full"><label class="form-label">備考</label><textarea id="editNotes">${esc(lead.notes||'')}</textarea></div>
        <div class="form-group full"><label class="form-label">返答できなかった質問</label><textarea id="editUnansweredQ" style="min-height:60px">${esc(lead.unansweredQ||'')}</textarea></div>
        <div class="form-group full"><label class="form-label">次のアクション</label><input id="editAction" value="${esc(lead.nextAction||'')}"></div>
      </div>
      <div class="form-actions" style="margin-top:20px;display:flex">
        <button class="btn btn-outline" data-action="closeModal">キャンセル</button>
        <button class="btn btn-primary" data-action="saveEdit" data-id="${lead.id}">保存</button>
      </div>`;
    modal.querySelectorAll('.team-option').forEach(el=>{
      el.addEventListener('click',()=>{modal.querySelectorAll('.team-option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');el.querySelector('input').checked=true});
    });
    modal.querySelectorAll('.prio-option').forEach(el=>{
      el.addEventListener('click',()=>{modal.querySelectorAll('.prio-option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');el.querySelector('input').checked=true});
    });
  }
  requestAnimationFrame(()=>overlay.classList.add('visible'));
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('visible')}

// 進捗管理のKPIカード（未対応/日程調整中/日程確定/完了）をタップすると
// 該当するリードの一覧をモーダルで表示する
function showStageListModal(stage){
  const overlay=document.getElementById('modalOverlay');
  const modal=document.getElementById('modal');
  const matched=sortByFollowupPriority(state.leads.filter(l=>(l.followupStatus||'未着手')===stage));
  modal.innerHTML=`
    <div class="modal-header"><h2>${esc(stageLabel(stage))}（${matched.length}件）</h2><button class="modal-close" data-action="closeModal">&times;</button></div>
    ${matched.length?matched.map(l=>`
      <div class="stage-list-row" data-action="view" data-id="${l.id}">
        <div class="stage-list-photo">${photoOrIcon(l)}</div>
        <div class="stage-list-info">
          <div class="stage-list-name">${esc(l.name||l.company||'氏名未入力')}</div>
          <div class="stage-list-company">${esc(l.company)}${l.team?'・'+esc(l.team):''}</div>
        </div>
        ${stageBadgeHtml(l)}
      </div>
    `).join(''):'<div class="empty-state"><p>該当するリードはありません</p></div>'}
  `;
  requestAnimationFrame(()=>overlay.classList.add('visible'));
}

function exportCSV(){
  const headers=['氏名','会社名','部署','役職','メール','電話','住所','業種','担当者','重要度','備考','返答できなかった質問','進捗','連絡方法','連絡日','面談形式','面談日','登録日'];
  const rows=state.leads.map(l=>[l.name,l.company,l.department,l.position,l.email,l.phone,l.address,l.industry,l.team,l.priority,l.notes,l.unansweredQ||'',stageLabel(l.followupStatus||'未着手'),l.contactMethod||'',l.contactedDate||'',l.meetingType||'',l.meetingDate||'',l.date]);
  const csv=[headers,...rows].map(r=>r.map(c=>`"${(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  if(window.claude?.downloads){
    window.claude.downloads.save({filename:`exhibition-leads-${today()}.csv`,data:blob}).catch(()=>{});
  } else {
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`leads-${today()}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
  }
  toast('CSVを出力しました');
}

// Global event delegation
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const action=btn.dataset.action;
  const id=btn.dataset.id;
  if(action==='view'){const l=state.leads.find(x=>x.id===id);if(l)showModal(l)}
  else if(action==='viewStage')showStageListModal(btn.dataset.stage);
  else if(action==='closeModal')closeModal();
  else if(action==='removePhoto'){state.regPhoto=null;state.regExtracted={company:'',name:'',department:'',position:'',phone:'',email:'',address:'',industry:''};state.regOcrStatus='idle';renderRegister()}
  else if(action==='clearForm'){state.regPhoto=null;state.regExtracted={company:'',name:'',department:'',position:'',phone:'',email:'',address:'',industry:''};state.regOcrStatus='idle';renderRegister()}
  else if(action==='saveLead')saveLead();
  else if(action==='export')exportCSV();
  else if(action==='goRegister')switchTab('register');
  else if(action==='editLead'){const l=state.leads.find(x=>x.id===id);if(l)showModal(l,'edit')}
  else if(action==='rescanPhoto')rescanPhoto(id);
  else if(action==='saveEdit'){
    const l=state.leads.find(x=>x.id===id);
    if(l){
      l.name=document.getElementById('editName')?.value.trim()||l.name;
      l.company=document.getElementById('editCompany')?.value.trim()||l.company;
      l.department=document.getElementById('editDept')?.value.trim()||'';
      l.position=document.getElementById('editPosition')?.value.trim()||'';
      l.email=document.getElementById('editEmail')?.value.trim()||'';
      l.phone=document.getElementById('editPhone')?.value.trim()||'';
      l.address=document.getElementById('editAddress')?.value.trim()||'';
      l.industry=document.getElementById('editIndustry')?.value||l.industry;
      const t=document.querySelector('#modal input[name="editTeam"]:checked');if(t)l.team=t.value;
      const p=document.querySelector('#modal input[name="editPriority"]:checked');if(p)l.priority=p.value;
      l.notes=document.getElementById('editNotes')?.value.trim()||'';
      l.unansweredQ=document.getElementById('editUnansweredQ')?.value.trim()||'';
      l.nextAction=document.getElementById('editAction')?.value.trim()||'';
      save();syncLeadToServer(l);closeModal();render();toast('更新しました');
    }
  }
  else if(action==='deleteLead'){if(confirm('このリードを削除しますか？')){state.leads=state.leads.filter(x=>x.id!==id);save();deleteLeadFromServer(id);closeModal();render();toast('削除しました')}}
  else if(action==='zoomPhoto')btn.classList.toggle('zoomed');
  else if(action==='openContactModal'){const l=state.leads.find(x=>x.id===id);if(l)showModal(l,'followup-contact')}
  else if(action==='openMeetingModal'){const l=state.leads.find(x=>x.id===id);if(l)showModal(l,'followup-meeting')}
  else if(action==='saveContact'){
    const l=state.leads.find(x=>x.id===id);
    const m=document.querySelector('#modal input[name="contactMethod"]:checked');
    if(!m){toast('連絡方法を選択してください');return}
    if(l){l.contactMethod=m.value;l.contactedDate=today();l.followupStatus='連絡済み';save();syncLeadToServer(l);closeModal();render();toast('記録しました')}
  }
  else if(action==='saveMeeting'){
    const l=state.leads.find(x=>x.id===id);
    const t=document.querySelector('#modal input[name="meetingType"]:checked');
    const d=document.getElementById('meetingDateInput')?.value;
    if(!t){toast('面談形式を選択してください');return}
    if(!d){toast('日付を入力してください');return}
    if(l){l.meetingType=t.value;l.meetingDate=d;l.followupStatus='日程確定';save();syncLeadToServer(l);closeModal();render();toast('日程を確定しました')}
  }
  else if(action==='markDone'){
    const l=state.leads.find(x=>x.id===id);
    if(l){l.followupStatus='完了';l.followed=true;save();syncLeadToServer(l);closeModal();render();toast('完了にしました')}
  }
});

// Tab switching (top nav + bottom nav)
document.querySelectorAll('[data-tab]').forEach(b=>{
  if(b.classList.contains('bnav-center-btn')||b.classList.contains('bnav-btn')||b.classList.contains('tab-btn-top')){
    b.addEventListener('click',()=>switchTab(b.dataset.tab));
  }
});

document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});

// Theme
document.getElementById('themeToggle').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('exh-theme',next);
  updateThemeIcon();
});
function updateThemeIcon(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('themeIcon').innerHTML=dark
    ?'<path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}

// Resize handler
window.addEventListener('resize',updateStickySubmit);

// バージョンが古いキャッシュを開いた場合に一度だけ強制リロードする
const APP_VERSION='25';
if(localStorage.getItem('exh-app-version')!==APP_VERSION){
  localStorage.setItem('exh-app-version',APP_VERSION);
  if(!location.search.includes('v='))location.replace(location.pathname+'?v='+APP_VERSION);
}

// デモ用サンプルデータを一度だけ自動削除する（本番運用開始時のリセット）
if(!localStorage.getItem('exh-demo-cleared-v1')){
  localStorage.removeItem('exh-leads');
  localStorage.setItem('exh-demo-cleared-v1','1');
}

// Init
const savedTheme=localStorage.getItem('exh-theme');
if(savedTheme)document.documentElement.setAttribute('data-theme',savedTheme);
updateThemeIcon();
load();
render();
updateStickySubmit();
syncFromServer().then(()=>{render();updateStickySubmit()});

// 検索ボックスなどに入力中は、バックグラウンド同期のrender()で
// フォーカス・カーソル位置が失われて入力が中断されないようにする
function isTyping(){
  const a=document.activeElement;
  return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
}

// 他のメンバーが登録したリードを定期的に取り込む（入力中のフォームは邪魔しない）
setInterval(async()=>{
  const ok=await syncFromServer();
  if(ok&&state.tab!=='register'&&!isTyping()){render()}
},15000);

// スマホ（特にAndroid）は画面ロックやアプリ切替でバックグラウンドタブの
// タイマーが止まる（間引かれる）ため、setIntervalだけでは開きっぱなしの
// 画面に戻ってきても更新されないことがある。画面に戻ってきた瞬間に
// 強制的に同期し直す。
async function refreshOnReturn(){
  const ok=await syncFromServer();
  if(ok&&state.tab!=='register'&&!isTyping())render();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')refreshOnReturn();
});
window.addEventListener('focus',refreshOnReturn);
window.addEventListener('pageshow',refreshOnReturn);
</script>
